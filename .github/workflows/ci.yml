name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Native libraries for the echo canceller
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git g++ swig libspeex-dev libspeexdsp-dev
      - name: Install
        run: |
          python -m pip install --upgrade pip "setuptools<81" wheel
          # the repository until the release is on PyPI, then the bare name
          pip install "le-vogon-contract @ git+https://github.com/LendEasy/vogon-contract"
          pip install -e ".[front,dev]"
          deploy/build_speexdsp.sh python
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest tests -q
